bind=SUPER,Return,spawn,ghostty
bind=SUPER,d,spawn,/home/lm/.config/mango/scripts/menu.sh
bind=SUPER,s,spawn,/home/lm/.config/mango/scripts/search-windows.sh
bind=SUPER,r,spawn,/home/lm/.config/mango/scripts/launch-waybar.sh
bind=SUPER,b,spawn,firefox
bind=SUPER+SHIFT,b,spawn,/home/lm/.config/mango/scripts/select-firefox-profile.sh
bind=SUPER,l,spawn,/home/lm/.config/mango/scripts/lock-screen.sh
bind=SUPER,m,spawn,/home/lm/.config/mango/scripts/set-monitors.sh
bind=SUPER,w,spawn,nemo
bind=SUPER,g,spawn,gedit
bind=SUPER,p,spawn,rofi -show myscriptrunner -modi "myscriptrunner:/home/lm/.config/mango/scripts/rofi-script-runner.sh"
# bind=SUPER,u,switch_layout

bind=none,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bind=none,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -5%
bind=none,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +5%
bind=none,XF86MonBrightnessUp,spawn,brightnessctl set +10% -d intel_backlight
bind=none,XF86MonBrightnessDown,spawn,brightnessctl set 10%- -d intel_backlight

bind=SUPER,1,comboview,1
bind=SUPER,2,comboview,2
bind=SUPER,3,comboview,3
bind=SUPER,4,comboview,4
bind=SUPER,5,comboview,5
bind=SUPER,6,comboview,6
bind=SUPER,7,comboview,7
bind=SUPER,8,comboview,8
bind=SUPER,9,comboview,9

bind=SUPER,comma,setlayout,tile
bind=SUPER,period,setlayout,center_tile
bind=SUPER,slash,setlayout,right_tile

bind=SUPER,bracketleft,setlayout,grid
bind=SUPER,bracketright,setlayout,monocle

bind=SUPER,backslash,setlayout,scroller

bind=SUPER,q,killclient
bind=SUPER+SHIFT,r,reload_config

# Layouts
# bind=SUPER,t,setlayout,tile
# bind=SUPER,v,setlayout,vertical_grid
# bind=SUPER,c,setlayout,spiral
# bind=SUPER,x,setlayout,scroller
# bind=SUPER,m,switch_layout
# bind=SUPER,a,togglegaps

# Layouts in mango are per tag. So we'll set all tags to grid by default. 
tagrule=id:1,layout_name:grid
tagrule=id:2,layout_name:grid
tagrule=id:3,layout_name:grid
tagrule=id:4,layout_name:grid
tagrule=id:5,layout_name:grid
tagrule=id:6,layout_name:grid
tagrule=id:7,layout_name:grid
tagrule=id:8,layout_name:grid
tagrule=id:9,layout_name:grid


animations=1
gappih=5
gappiv=5
gappoh=5
gappov=5
borderpx=4
no_border_when_single=0
focuscolor=0x005577ff

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# options
repeat_rate=35
repeat_delay=200

# Effect
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating=1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide 
layer_animation_type_open=slide
layer_animation_type_close=slide 
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.7
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,f,togglefloating,
bind=SUPER,0,toggleoverview

# switch window focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# move to tags
# bind=SUPER,Prior,viewtoleft
# bind=SUPER,Next,viewtoright
bind=SUPER+CTRL,Left,viewtoleft
bind=SUPER+CTRL,Right,viewtoright

# move window to tags
bind=SUPER+SHIFT,Prior,tagtoleft
bind=SUPER+SHIFT,Next,tagtoright

# Gesturebind
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview


# =============================================================

# cursor size
cursor_size=24
env=XCURSOR_SIZE,24

# fcitx5 im
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus

# scale factor about qt (herr is 1.4)
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_QPA_PLATFORM,Wayland;xcb
env=QT_WAYLAND_FORCE_DPI,140

exec=bash ~/.config/mango/autostart.sh